
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Study Hub - Signup</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101d42, #5541a5);
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px #0004;
    }

    h1 {
      text-align: center;
      color: #263779;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #666;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #5142b5;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Smart Study Hub</h1>
    <p>Create Your Student Account</p>

    <form id="signupForm">

      <input
        type="text"
        id="name"
        placeholder="Enter Full Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Enter Email Address"
        required
      >

      <select id="course" required>
        <option value="">Select Your Course</option>
        <option value="BTech CSE">BTech CSE</option>
        <option value="BCA">BCA</option>
        <option value="BSc">BSc</option>
        <option value="Other">Other</option>
      </select>

      <button type="submit" id="signupBtn">
        Sign Up
      </button>

    </form>

    <div id="message"></div>
  </div>

  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbwyLBVdPKCfPVSYlYdRYCMsvUIArcqjTUclDMVGMUcQUbqSsu0drVrkLVB2z1HzpgkUIQ/exec";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const course = document.getElementById("course").value;

      if (!name || !email || !course) {
        message.textContent = "Please fill all details.";
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";
      message.textContent = "Please wait...";

      try {
        const response = await fetch(SHEET_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            name: name,
            email: email,
            course: course,
            uid: ""
          })
        });

        const result = await response.json();

        if (result.success) {
          message.textContent = "Registration successful!";
          message.style.color = "green";

          setTimeout(function() {
            window.location.href = "./dashboard.html";
          }, 1000);

        } else {
          throw new Error(result.message || "Registration failed");
        }

      } catch (error) {
        message.textContent =
          "Data save nahi hua: " + error.message;
        message.style.color = "red";

        button.disabled = false;
        button.textContent = "Sign Up";
      }
    });
  </script>

</body>
</html>
