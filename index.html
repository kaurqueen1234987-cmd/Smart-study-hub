
        
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Study Hub - Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px #77777740;
    }

    h1 {
      text-align: center;
      color: #a64ca6;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #777;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 15px;
    }

    input, select {
      border: 1px solid #ddd;
    }

    button {
      background: #c45acb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #a640ad;
    }

    #message {
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Smart Study Hub</h1>
    <p>Create Your Student Account</p>

    <form id="signupForm">

      <input
        type="text"
        id="name"
        placeholder="Enter Your Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Enter Your Email"
        required
      >

      <select id="course" required>
        <option value="">Select Your Course</option>
        <option value="BTech">BTech</option>
        <option value="BCA">BCA</option>
        <option value="BBA">BBA</option>
        <option value="Other">Other</option>
      </select>

      <input
        type="password"
        id="password"
        placeholder="Create Password"
        required
      >

      <button type="submit" id="signupBtn">
        Sign Up
      </button>

      <p id="message"></p>

    </form>
  </div>

  <script>
    // Paste your Google Apps Script Web App URL here
    const GOOGLE_SHEET_URL = "PASTE_YOUR_DEPLOY_URL_HERE";

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const button = document.getElementById("signupBtn");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const studentData = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        course: document.getElementById("course").value
      };

      if (GOOGLE_SHEET_URL === "PASTE_YOUR_DEPLOY_URL_HERE") {
        message.textContent = "Please add your Google Sheets URL first.";
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(studentData)
        });

        message.textContent =
          "Request sent! Please check your Google Sheet.";

        form.reset();

      } catch (error) {
        message.textContent =
          "Something went wrong. Please try again.";
      }

      button.disabled = false;
      button.textContent = "Sign Up";
    });
  </script>

</body>
</html>
