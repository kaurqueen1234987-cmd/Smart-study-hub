
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Study Hub - Videos</title>

  <style>
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    }

    h1 {
      text-align: center;
      color: #853b91;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px #7773;
    }

    .card h2 {
      color: #a64ca6;
    }

    .card a {
      display: inline-block;
      background: #c45acb;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 10px;
    }

    .card a:hover {
      background: #963c9e;
    }
  </style>
</head>

<body>

  <h1>Smart Study Hub</h1>
  <h2 style="text-align:center;">Study Videos</h2>

  <div class="container">

    <div class="card">
      <h2>Mathematics</h2>
      <p>Learn Maths with educational videos.</p>
      <a href="https://www.youtube.com/results?search_query=engineering+mathematics+1st+year+lectures"
         target="_blank" rel="noopener">
        Watch Videos
      </a>
    </div>

    <div class="card">
      <h2>Physics</h2>
      <p>Understand Physics concepts.</p>
      <a href="https://www.youtube.com/results?search_query=engineering+physics+1st+year+lectures"
         target="_blank" rel="noopener">
        Watch Videos
      </a>
    </div>

    <div class="card">
      <h2>Chemistry</h2>
      <p>Learn Chemistry topics.</p>
      <a href="https://www.youtube.com/results?search_query=engineering+chemistry+lectures"
         target="_blank" rel="noopener">
        Watch Videos
      </a>
    </div>

    <div class="card">
      <h2>Computer Science</h2>
      <p>Learn C++ and programming.</p>
      <a href="https://www.youtube.com/results?search_query=C%2B%2B+programming+for+beginners"
         target="_blank" rel="noopener">
        Watch Videos
      </a>
    </div>

  </div>

</body>
</html>
